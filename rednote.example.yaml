port: 8082 # 端口
allowedOrigins:
  - http://127.0.0.1:5173
  - http://localhost:5173
jwtSecret: change-me-to-a-random-string # JWT 签名密钥，生产环境务必修改
uploadDir: ./data/uploads # 上传文件目录

logger:
  filename: ./data/logs/rednote.log
  maxSize: 100
  maxAge: 10
  maxBackups: 10

# 数据库连接（PostgreSQL）
db:
  url: host=127.0.0.1 port=5432 user=postgres password=postgres dbname=rednote sslmode=disable TimeZone=Asia/Shanghai
  maxIdleConns: 10
  maxOpenConns: 100
  logLevel: warn # SQL日志级别：silent、error、warn、info
